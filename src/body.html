<div id="app-container" style="width: 100%; height: 100%; min-height: 400px;">
    <!-- Version Selection UI -->
    <div id="version-selector" style="display: flex; flex-direction: column; align-items: center; padding: 20px; height: 100%; min-height: 400px; justify-content: center; background: #1a1a1a;">
        <h2 style="color: white; margin-bottom: 30px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">Choose ArcOS Version</h2>
        <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; max-width: 600px;">
            
            <div class="version-card" data-version="v5" style="background: #2a2a2a; border-radius: 10px; padding: 20px; text-align: center; cursor: pointer; border: 2px solid transparent; transition: all 0.3s;">
                <div class="version-logo" style="width: 80px; height: 80px; margin: 0 auto 15px; display: flex; align-items: center; justify-content: center;">
                    <img src="logo/v5.svg" alt="ArcOS v5" style="width: 60px; height: 60px; object-fit: contain;">
                </div>
                <h3 style="color: white; margin: 0 0 10px;">ArcOS v5</h3>
                <p style="color: #ccc; margin: 0; font-size: 14px;">Unsupported</p>
            </div>
            
            <div class="version-card" data-version="v6" style="background: #2a2a2a; border-radius: 10px; padding: 20px; text-align: center; cursor: pointer; border: 2px solid transparent; transition: all 0.3s;">
                <div class="version-logo" style="width: 80px; height: 80px; margin: 0 auto 15px; display: flex; align-items: center; justify-content: center;">
                    <img src="logo/v6.png" alt="ArcOS v6" style="width: 60px; height: 60px; object-fit: contain;">
                </div>
                <h3 style="color: white; margin: 0 0 10px;">ArcOS v6</h3>
                <p style="color: #ccc; margin: 0; font-size: 14px;">Slightly less unsupported</p>
            </div>
            
            <div class="version-card" data-version="v7" style="background: #2a2a2a; border-radius: 10px; padding: 20px; text-align: center; cursor: pointer; border: 2px solid transparent; transition: all 0.3s;">
                <div class="version-logo" style="width: 80px; height: 80px; margin: 0 auto 15px; display: flex; align-items: center; justify-content: center;">
                    <img src="logo/v7.svg" alt="ArcOS v7" style="width: 60px; height: 60px; object-fit: contain;">
                </div>
                <h3 style="color: white; margin: 0 0 10px;">ArcOS v7</h3>
                <p style="color: #ccc; margin: 0; font-size: 14px;">Latest stable</p>
            </div>
            
            <div class="version-card" data-version="nightly" style="background: #2a2a2a; border-radius: 10px; padding: 20px; text-align: center; cursor: pointer; border: 2px solid transparent; transition: all 0.3s;">
                <div class="version-logo" style="width: 80px; height: 80px; margin: 0 auto 15px; display: flex; align-items: center; justify-content: center;">
                    <img src="logo/nightly.svg" alt="ArcOS Nightly" style="width: 60px; height: 60px; object-fit: contain;">
                </div>
                <h3 style="color: white; margin: 0 0 10px;">ArcOS Nightly</h3>
                <p style="color: #ccc; margin: 0; font-size: 14px;">Unstable build</p>
            </div>
            
        </div>
    </div>
    
    <!-- The iframe that will load ArcOS (initially hidden) -->
    <iframe id="arcos-frame" src="" frameborder="0" style="display: none; width: 100%; height: 100%;"></iframe>
</div>

<style>
    body {
        margin: 0;
        padding: 0;
        background: #1a1a1a;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    
    .version-card:hover {
        border-color: #007acc !important;
        transform: translateY(-2px);
    }
    
    .version-card:active {
        transform: translateY(0);
    }
</style>
